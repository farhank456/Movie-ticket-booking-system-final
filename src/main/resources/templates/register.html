<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/head :: head('Register')}"></head><body><div th:replace="~{fragments/nav :: nav}"></div><main class="container py-5"><div class="auth-card mx-auto"><h2 class="fw-bold">Create account</h2><div th:if="${error}" class="alert alert-danger" th:text="${error}"></div><form th:action="@{/register}" th:object="${user}" method="post"><label>Name</label><input class="form-control mb-3" th:field="*{name}" required><label>Email</label><input class="form-control mb-3" type="email" th:field="*{email}" required><label>Phone</label><input class="form-control mb-3" th:field="*{phone}"><label>Password</label><input class="form-control mb-3" type="password" th:field="*{password}" required><button class="btn btn-primary w-100">Register</button></form></div></main></body></html>
