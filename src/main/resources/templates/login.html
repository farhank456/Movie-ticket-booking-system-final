<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/head :: head('Login')}"></head><body><div th:replace="~{fragments/nav :: nav}"></div><main class="container py-5"><div class="auth-card mx-auto"><h2 class="fw-bold mb-1">Welcome back</h2><p class="text-muted">Login to continue booking.</p><div th:if="${param.registered}" class="alert alert-success">Registration successful. Please login.</div><div th:if="${error}" class="alert alert-danger" th:text="${error}"></div><form method="post" action="/login"><label>Email</label><input class="form-control mb-3" type="email" name="email" required><label>Password</label><input class="form-control mb-3" type="password" name="password" required><button class="btn btn-dark w-100">Login</button></form><p class="mt-3 mb-0">New user? <a href="/register">Create account</a></p></div></main></body></html>
