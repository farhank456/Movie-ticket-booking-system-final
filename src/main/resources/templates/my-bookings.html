<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/head :: head('My Bookings')}"></head><body><div th:replace="~{fragments/nav :: nav}"></div><main class="container py-5"><h2>My Bookings</h2><div th:if="${bookings.isEmpty()}" class="alert alert-info mt-4">You have no bookings yet.</div><div class="table-responsive mt-4" th:unless="${bookings.isEmpty()}"><table class="table align-middle"><thead><tr><th>ID</th><th>Movie</th><th>Show</th><th>Amount</th><th>Status</th><th></th></tr></thead><tbody><tr th:each="b:${bookings}"><td th:text="${'#'+b.bookingId}"></td><td th:text="${b.show.movie.title}"></td><td th:text="${#temporals.format(b.show.showDate,'dd MMM')+' '+#temporals.format(b.show.showTime,'hh:mm a')}"></td><td th:text="'₹'+${b.totalAmount}"></td><td><span class="badge" th:classappend="${b.bookingStatus.name()=='CONFIRMED'?'text-bg-success':'text-bg-secondary'}" th:text="${b.bookingStatus}"></span></td><td><a class="btn btn-sm btn-outline-dark" th:href="@{'/booking/'+${b.bookingId}}">View</a><form th:if="${b.bookingStatus.name()=='CONFIRMED'}" class="d-inline" method="post" th:action="@{'/booking/'+${b.bookingId}+'/cancel'}"><button class="btn btn-sm btn-outline-danger">Cancel</button></form></td></tr></tbody></table></div></main></body></html>
