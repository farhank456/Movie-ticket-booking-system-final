<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/head :: head(${movie.title})}"></head><body><div th:replace="~{fragments/nav :: nav}"></div><main class="container py-5"><div class="row g-5"><div class="col-md-4"><img th:src="${movie.posterUrl}" class="img-fluid rounded-4 shadow"></div><div class="col-md-8"><span class="badge text-bg-primary" th:text="${movie.genre}"></span><h1 class="display-5 fw-bold mt-2" th:text="${movie.title}"></h1><p class="lead text-muted" th:text="${movie.description}"></p><p><b>Duration:</b> <span th:text="${movie.duration}"></span> min &nbsp; <b>Language:</b> <span th:text="${movie.language}"></span></p><hr><h3 class="mb-3">Available Shows</h3><div th:if="${shows.isEmpty()}" class="alert alert-warning">No shows available.</div><div class="show-row" th:each="show:${shows}"><div><b th:text="${show.screen.theatre.name}"></b><div class="small text-muted" th:text="${show.screen.theatre.location + ' • ' + show.screen.screenName}"></div></div><div class="text-end"><div th:text="${#temporals.format(show.showDate,'dd MMM yyyy') + ' • ' + #temporals.format(show.showTime,'hh:mm a')}"></div><b th:text="'₹' + ${show.price}"></b></div><a th:href="@{'/show/' + ${show.showId} + '/seats'}" class="btn btn-dark">Select Seats</a></div></div></div></main></body></html>
