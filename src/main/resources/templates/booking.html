<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/head :: head('Booking Confirmation')}"></head><body><div th:replace="~{fragments/nav :: nav}"></div><main class="container py-5"><div class="confirmation mx-auto"><div class="check">✓</div><h1>Booking Confirmed</h1><p class="text-muted">Your movie ticket has been booked successfully.</p><div class="ticket"><div><small>Movie</small><h4 th:text="${booking.show.movie.title}"></h4></div><div><small>Booking ID</small><h5 th:text="${'#' + booking.bookingId}"></h5></div><div><small>Theatre</small><p th:text="${booking.show.screen.theatre.name}"></p></div><div><small>Show</small><p th:text="${#temporals.format(booking.show.showDate,'dd MMM yyyy') + ' • ' + #temporals.format(booking.show.showTime,'hh:mm a')}"></p></div><div><small>Total</small><h4 th:text="'₹' + ${booking.totalAmount}"></h4></div><div th:if="${payment}"><small>Transaction</small><p class="small" th:text="${payment.transactionId}"></p></div></div><a href="/my-bookings" class="btn btn-dark">My Bookings</a><a href="/" class="btn btn-outline-dark ms-2">Back to Movies</a></div></main></body></html>
