<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/head :: head('CineBook | Movies')}"></head><body><div th:replace="~{fragments/nav :: nav}"></div>
<header class="hero"><div class="container py-5"><div class="row align-items-center"><div class="col-lg-7"><h1 class="display-4 fw-bold">Book your next movie night.</h1><p class="lead">Browse movies, choose a show, select your seats and get instant confirmation.</p></div><div class="col-lg-5"><form class="search-box" method="get" action="/"><input name="q" th:value="${q}" class="form-control form-control-lg" placeholder="Search movies..."><button class="btn btn-primary btn-lg mt-2 w-100">Search</button></form></div></div></div></header>
<main class="container py-5"><div class="d-flex justify-content-between align-items-center mb-4"><h2>Now Showing</h2><span class="text-muted" th:text="${movies.size()} + ' movies'"></span></div><div class="row g-4"><div class="col-md-4 col-lg-3" th:each="movie : ${movies}"><div class="card movie-card h-100 shadow-sm"><img th:src="${movie.posterUrl != null ? movie.posterUrl : 'https://via.placeholder.com/500x750?text=Movie'}" class="card-img-top poster"><div class="card-body d-flex flex-column"><h5 th:text="${movie.title}"></h5><p class="text-muted small" th:text="${movie.genre + ' • ' + movie.duration + ' min • ' + movie.language}"></p><p class="small flex-grow-1" th:text="${movie.description}"></p><a th:href="@{'/movie/' + ${movie.movieId}}" class="btn btn-dark w-100">View Shows</a></div></div></div></div><div class="alert alert-light border mt-5">Demo accounts are available in the README. Admin features are accessible after logging in as admin.</div></main><div th:replace="~{fragments/footer :: footer}"></div></body></html>
