<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/head :: head('Select Seats')}"></head><body><div th:replace="~{fragments/nav :: nav}"></div><main class="container py-5"><div class="row g-4"><div class="col-lg-8"><h2>Select Seats</h2><p class="text-muted" th:text="${show.movie.title + ' • ' + show.screen.theatre.name + ' • ' + #temporals.format(show.showTime,'hh:mm a')}"></p><div th:if="${error}" class="alert alert-danger" th:text="${error}"></div><div class="screen-label">SCREEN</div><form method="post" action="/book" id="bookingForm"><input type="hidden" name="showId" th:value="${show.showId}"><div class="seat-grid"><label th:each="seat:${seats}" class="seat" th:classappend="${booked.contains(seat.seatId)?'booked':''}"><input type="checkbox" name="seatIds" th:value="${seat.seatId}" th:disabled="${booked.contains(seat.seatId)}"><span th:text="${seat.seatNumber}"></span></label></div><div class="mt-4"><label class="form-label">Payment method</label><select name="paymentMethod" class="form-select"><option>UPI</option><option>Card</option><option>Net Banking</option><option>Cash</option></select><button class="btn btn-primary btn-lg mt-3 w-100">Confirm Booking</button></div></form></div><div class="col-lg-4"><div class="summary-card"><h4>Show Summary</h4><p th:text="${show.movie.title}"></p><p th:text="${show.screen.theatre.name + ' - ' + show.screen.screenName}"></p><p th:text="${#temporals.format(show.showDate,'dd MMM yyyy') + ', ' + #temporals.format(show.showTime,'hh:mm a')}"></p><hr><p>Price per seat <b class="float-end" th:text="'₹' + ${show.price}"></b></p><p class="small text-muted">Green/available seats can be selected. Grey seats are already booked.</p></div></div></div></main></body></html>
