<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/head :: head('Add Movie')}"></head><body><div th:replace="~{fragments/nav :: nav}"></div><main class="container py-5"><div class="form-card"><h2>Add Movie</h2><form method="post" action="/admin/movies/save" th:object="${movie}"><label>Title</label><input class="form-control mb-3" th:field="*{title}" required><label>Description</label><textarea class="form-control mb-3" rows="4" th:field="*{description}"></textarea><div class="row"><div class="col-md-4"><label>Genre</label><input class="form-control mb-3" th:field="*{genre}"></div><div class="col-md-4"><label>Duration (minutes)</label><input class="form-control mb-3" type="number" th:field="*{duration}"></div><div class="col-md-4"><label>Language</label><input class="form-control mb-3" th:field="*{language}"></div></div><label>Poster URL</label><input class="form-control mb-3" th:field="*{posterUrl}"><button class="btn btn-primary">Save Movie</button></form></div></main></body></html>
