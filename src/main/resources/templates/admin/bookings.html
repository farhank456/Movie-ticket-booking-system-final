<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/head :: head('All Bookings')}"></head><body><div th:replace="~{fragments/nav :: nav}"></div><main class="container py-5"><h2>All Bookings</h2><div class="table-responsive mt-4"><table class="table"><thead><tr><th>ID</th><th>User</th><th>Movie</th><th>Show</th><th>Amount</th><th>Status</th></tr></thead><tbody><tr th:each="b:${bookings}"><td th:text="${b.bookingId}"></td><td th:text="${b.user.email}"></td><td th:text="${b.show.movie.title}"></td><td th:text="${b.show.showDate+' '+b.show.showTime}"></td><td th:text="'₹'+${b.totalAmount}"></td><td th:text="${b.bookingStatus}"></td></tr></tbody></table></div></main></body></html>
