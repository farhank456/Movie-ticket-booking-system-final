<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/head :: head('Manage Movies')}"></head><body><div th:replace="~{fragments/nav :: nav}"></div><main class="container py-5"><div class="d-flex justify-content-between mb-4"><h2>Manage Movies</h2><a href="/admin/movies/new" class="btn btn-primary">+ Add Movie</a></div><div class="table-responsive"><table class="table"><thead><tr><th>Movie</th><th>Genre</th><th>Duration</th><th>Language</th><th></th></tr></thead><tbody><tr th:each="m:${movies}"><td th:text="${m.title}"></td><td th:text="${m.genre}"></td><td th:text="${m.duration+' min'}"></td><td th:text="${m.language}"></td><td><form method="post" th:action="@{'/admin/movies/delete/'+${m.movieId}}"><button class="btn btn-sm btn-outline-danger">Delete</button></form></td></tr></tbody></table></div></main></body></html>
