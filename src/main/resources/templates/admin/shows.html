<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/head :: head('Manage Shows')}"></head><body><div th:replace="~{fragments/nav :: nav}"></div><main class="container py-5"><h2>Manage Shows</h2><div class="form-card my-4"><form method="post" action="/admin/shows/save" class="row g-2"><div class="col-md-3"><select class="form-select" name="movieId" required><option value="">Movie</option><option th:each="m:${movies}" th:value="${m.movieId}" th:text="${m.title}"></option></select></div><div class="col-md-3"><select class="form-select" name="screenId" required><option value="">Screen</option><option th:each="s:${screens}" th:value="${s.screenId}" th:text="${s.theatre.name+' - '+s.screenName}"></option></select></div><div class="col-md-2"><input class="form-control" type="date" name="showDate" required></div><div class="col-md-2"><input class="form-control" type="time" name="showTime" required></div><div class="col-md-1"><input class="form-control" type="number" step="0.01" name="price" placeholder="₹" required></div><div class="col-md-1"><button class="btn btn-primary w-100">Add</button></div></form></div><table class="table"><thead><tr><th>Movie</th><th>Venue</th><th>Date</th><th>Time</th><th>Price</th><th></th></tr></thead><tbody><tr th:each="s:${shows}"><td th:text="${s.movie.title}"></td><td th:text="${s.screen.theatre.name+' / '+s.screen.screenName}"></td><td th:text="${s.showDate}"></td><td th:text="${s.showTime}"></td><td th:text="'₹'+${s.price}"></td><td><form method="post" th:action="@{'/admin/shows/delete/'+${s.showId}}"><button class="btn btn-sm btn-outline-danger">Delete</button></form></td></tr></tbody></table></main></body></html>
